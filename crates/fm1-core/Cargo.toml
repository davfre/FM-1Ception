[package]
name = "fm1-core"
description = "FM-1 CPU interpreter core; talks to the outside only through the Bus trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# save-states: a core's state as a serde value (`CoreState`)
state = ["dep:serde"]

[dependencies]
fm1-isa = { path = "../fm1-isa" }
serde = { version = "1", features = ["derive"], optional = true }
