[package]
name = "fm1-soc"
description = "FM-1 SoC: memory map and peripherals, implements the fm1-core Bus trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# save-states of a whole machine (state.rs)
state = ["dep:serde", "dep:bincode", "dep:miniz_oxide", "fm1-core/state"]

[dependencies]
fm1-core = { path = "../fm1-core" }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
miniz_oxide = { version = "0.8", optional = true }
